<!doctype html>
<html>
  <body style="font-family: Arial, sans-serif; color: #111827; line-height: 1.5; margin: 0; padding: 24px;">
    <h2>Confirm your Human Signal Index email</h2>

    <p>Click below to confirm your account and finish signing up.</p>

    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/dashboard"
        style="display:inline-block;padding:12px 18px;background:#111827;color:#ffffff;text-decoration:none;border-radius:8px;"
      >
        Confirm your email
      </a>
    </p>

    <p>Or enter this code inside the platform:</p>

    <p style="font-size:20px;font-weight:bold;letter-spacing:2px;">
      {{ .Token }}
    </p>

    <p>If you did not request this, you can safely ignore this email.</p>

    <p>
      Human Signal Index<br />
      support@humansignalindex.org
    </p>
  </body>
</html>
